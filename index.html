<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taylor Allan</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/12c0c96e87.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="about-me">
        <nav>
            <div class="personal__logo">Taylor Allan</div>
            <ul class="nav__link--list">
                <li>
                    <a href="" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black
                    ">Languages</a>
                </li>
                <li>
                    <a href="" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black
                    ">Projects</a>
                </li>
                <li>
                    <a href="" class="
                    nav__link--anchor
                    nav__link--anchor-primary
                    ">Contact</a>
                </li>
            </ul>
        </nav>
        <div class=" flex flex-1">
            <div class="about-me__info row">
                <div class="about-me__info--container">
                    <figure class="about-me__picture--mask">
                        <img src="./my ePortfolio assets/me.jpg" class="about-me__picture" alt="picture of me!">
                    </figure>
                    <h1 class="about-me__info--title">
                        Hey! I'm <span class="text--purple">Taylor Allan </span>👋
                    </h1>
                    <p class="about-me__info--para">
                        I'm a <strong class="text purple">frontend software engineer</strong> with a passion for positively impacting the world.
                    </p>
                    <div class="about-me__links">
                        <a href="" class="about-me__link">
                            <i class="fa-brands fa-linkedin"></i>
                        </a>
                        <a href="" class="about-me__link">
                            <i class="fa-brands fa-square-github"></i>
                        </a>
                    </div>    
                </div>
                <figure class="about_me__img--container">
                    <img src="./my ePortfolio assets/undraw_proud-coder_bivp.svg" class="about_me__img" alt="">
                </figure>
            </div>
        </div>
    </section>
    <section id="languages">
        <div class="container">
            <div class="row">
                <h1 class="section__title">This is my <span class="text--purple"> technology stack</span></h1>
                <div class="language__list">
                    <div class="language">
                        <figure class="language__img--wrapper">
                            <img src="./my ePortfolio assets/html5-brands-solid-full.svg" alt="" class="language__img">
                            <span class="language__name">HTML</span>
                    </div>
                    <div class="language">
                        <figure class="language__img--wrapper">
                            <img src="./my ePortfolio assets/css-131-722685.webp" alt="" class="language__img">
                            <span class="language__name">HTML</span>
                    </div>
                    <div class="language">
                        <figure class="language__img--wrapper">
                            <img src="./my ePortfolio assets/javascript-1-225993.webp" alt="" class="language__img">
                            <span class="language__name">HTML</span>
                        </figure>
                    </div>
                    <div class="language">
                        <figure class="language__img--wrapper">
                            <img src="./my ePortfolio assets/react-3-1175109.webp" alt="" class="language__img">
                            <span class="language__name">HTML</span>
                        </figure>
                    </div>
                    <div class="language">
                        <figure class="language__img--wrapper">
                            <img src="./my ePortfolio assets/typescript-3521774-2945272.webp" alt="" class="language__img">
                            <span class="language__name">HTML</span>
                        </figure>
                    </div>
                    <div class="language">
                        <figure class="language__img--wrapper">
                            <img src="./my ePortfolio assets/mobx.webp" alt="" class="language__img">
                            <span class="language__name">HTML</span>
                        </figure>
                    </div>
                    <div class="language">
                        <figure class="language__img--wrapper">
                            <img src="./my ePortfolio assets/nuxt-dot-js-3628959-3030184.webp" alt="" class="language__img">
                            <span class="language__name">HTML</span>
                        </figure>
                    </div>
                    <div class="language">
                        <figure class="language__img--wrapper">
                            <img src="./my ePortfolio assets/vue-282497.webp" alt="" class="language__img">
                            <span class="language__name">HTML</span>
                        </figure>
                    </div>
                </div>   
            </div>
        </div>
    </section>
</body>
</html>
